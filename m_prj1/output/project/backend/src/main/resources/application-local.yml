spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: postgres
    password: postgres

  flyway:
    clean-on-validation-error: true   # 로컬 전용: 체크섬 불일치 시 자동 clean 후 재적용

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
          kakao:
            client-id: dummy-kakao-client-id
            client-secret: dummy-kakao-client-secret

jwt:
  # 로컬 개발용 시크릿 (최소 32자 이상)
  secret: local-dev-secret-key-min-32-characters-long
  access-token-expiry: 900
  refresh-token-expiry: 604800

app:
  allowed-origins: http://localhost:5173
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/callback

s3:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: uploads
  region: ap-northeast-2

sendgrid:
  api-key: ""
  from-email: no-reply@example.com

ncp:
  sms:
    access-key: ""
    secret-key: ""
    service-id: ""
    sender-phone: ""

external:
  data-api:
    base-url: http://localhost:8090
    api-key: dummy-api-key

feign:
  circuitbreaker:
    enabled: false

logging:
  level:
    com.example.app: DEBUG
    org.springframework.security: DEBUG
