services:
  # ── 인프라 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # ── 애플리케이션 ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/appdb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: uploads
      S3_REGION: ap-northeast-2
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: http://localhost
      OAUTH2_REDIRECT_URI: http://localhost/oauth2/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      NCP_SMS_ACCESS_KEY: ${NCP_SMS_ACCESS_KEY:-}
      NCP_SMS_SECRET_KEY: ${NCP_SMS_SECRET_KEY:-}
      NCP_SMS_SERVICE_ID: ${NCP_SMS_SERVICE_ID:-}
      NCP_SMS_SENDER_PHONE: ${NCP_SMS_SENDER_PHONE:-}
      EXTERNAL_DATA_API_BASE_URL: ${EXTERNAL_DATA_API_BASE_URL:-https://api.example.com}
      EXTERNAL_DATA_API_KEY: ${EXTERNAL_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_APP_NAME: "API Service"
        VITE_OAUTH2_GOOGLE_URL: "/oauth2/authorization/google"
        VITE_OAUTH2_KAKAO_URL: "/oauth2/authorization/kakao"
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
